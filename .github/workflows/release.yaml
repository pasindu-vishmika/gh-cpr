name: release

on:
  push:
    branches: [main]
    paths:
      - 'utils/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      # Merging a release PR only touches the manifest; it must still run so
      # release-please can tag the release and publish it.
      - '.release-please-manifest.json'
      - '.github/workflows/release.yaml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit of v5.0.0 so a moved tag can't change what runs.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
